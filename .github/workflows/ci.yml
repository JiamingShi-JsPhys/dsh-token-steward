name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plugin:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    name: dsh-token-steward · node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - name: Typecheck (strict + exactOptionalPropertyTypes)
        run: npm run typecheck
      - name: Build (host ESM + client ModuleLoader bundle)
        run: npm run build
      - name: Tests (all assertions, zero external services)
        run: npm run test:only

  probe:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22', '24']
    name: m0-rewrite-probe · node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Contract tests (fake harness, zero deps)
        working-directory: probes/m0-rewrite-probe
        run: node --test test/probe.test.mjs
