name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    name: dsh-token-steward · node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - name: Typecheck (strict + exactOptionalPropertyTypes)
        run: npm run typecheck
      - name: Build (host ESM + client ModuleLoader bundle)
        run: npm run build
      - name: Tests (all assertions, zero external services)
        run: npm run test:only

  probe:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22', '24']
    name: m0-rewrite-probe · node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Contract tests (fake harness, zero deps)
        working-directory: probes/m0-rewrite-probe
        run: node --test test/probe.test.mjs
